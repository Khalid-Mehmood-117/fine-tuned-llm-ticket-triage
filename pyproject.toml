[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triage"
version = "0.1.0"
description = "Support ticket triage with a LoRA fine-tuned Qwen2.5-0.5B, business rules and evaluation"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triage = ["labels.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
